name: Build macOS app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core behavior checks
        run: swift run BarFoldCoreChecks
      - name: Build and verify app signature
        run: bash scripts/build-app.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent dist/BarFold.app dist/BarFold.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BarFold-macOS
          path: dist/BarFold.zip
